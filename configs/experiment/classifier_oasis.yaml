# @package _global_

# to execute this experiment run:
# python train.py experiment=classifier_oasis

defaults:
  - override /data: oasis
  - override /model: classifier
  - override /callbacks: default
  - override /trainer: default
  - override /logger: wandb

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["oasis", "classifier"]

seed: 42

trainer:
  min_epochs: 1
  max_epochs: 20
  accelerator: "cpu" # Default to CPU for now, can be overridden by user
  devices: 1

model:
  optimizer:
    lr: 0.001
  compile: false

data:
  batch_size: 4
  num_workers: 0

logger:
  wandb:
    tags: ${tags}
    group: "classifier"
