_target_: src.systems.diffusion_system.DiffusionSystem

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  weight_decay: 1e-6

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: 100
  eta_min: 1e-6

net:
  _target_: src.models.latent_diffusion.ConditionalDiffusionModel
  in_channels: 1
  out_channels: 1
  sample_size: 128
  condition_dim: 4
  cross_attention_dim: 256
  block_out_channels: [128, 256, 256, 512]
  layers_per_block: 2

num_train_timesteps: 1000
lambda_cycle: 0.1
